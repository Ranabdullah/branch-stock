<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Branch Stock</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script>
<body><header><div><strong>Branch Stock</strong><span id="mode">Demo · sample products</span></div><div><button id="demo">Open demo</button> <button id="connect">Connect as owner</button></div></header>
<main><h1 id="title">Stock by shop</h1><p id="message" role="status"></p>
<section id="owner" aria-label="Manage stock"><form id="shopForm"><label>New shop <input name="name" required maxlength="100" placeholder="Shop name"></label><button>Add shop</button></form>
<form id="productForm"><label>New product <input name="name" required maxlength="100" placeholder="Product name"></label><label>SKU <input name="sku" maxlength="60" placeholder="Optional"></label><button>Add product</button></form></section>
<section id="inventory"><div class="section-head"><h2>Inventory</h2><label>Shop <select id="shops"></select></label></div>
<div class="actions" id="shopActions"><button id="link">Create / replace shop link</button><button id="archiveShop">Archive shop</button></div>
<output id="share"></output><div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>In stock</th><th>Actions</th></tr></thead><tbody id="stock"></tbody></table></div></section>
<section><h2>Stock movements</h2><p class="muted">Latest 200 changes for the selected shop. Times are shown in your time zone.</p><div class="table-wrap"><table><thead><tr><th>Date and time</th><th>Product</th><th>Movement</th><th>Before</th><th>After</th><th>By</th><th>Note</th></tr></thead><tbody id="movements"></tbody></table></div></section>
</main><dialog id="connectDialog"><form id="connectForm"><h2>Connect as owner</h2><label>Owner key<input name="key" type="password" required pattern="[a-fA-F0-9]{64}" autocomplete="off"></label><button>Connect</button> <button type="button" data-close>Cancel</button></form></dialog>
<dialog id="movementDialog"><form id="movementForm"><h2 id="movementTitle">Record stock</h2><label>Movement<select name="kind"><option value="set">Set exact count</option><option value="in">Stock in</option><option value="out">Stock out</option></select></label><label>Quantity<input name="quantity" type="number" required min="0" max="100000000" step="1"></label><label>Note<input name="note" maxlength="180"></label><button>Save movement</button> <button type="button" data-close>Cancel</button></form></dialog>
</body></html>
